# Website (Next.js on 127.0.0.1:3001), installed by deploy/setup-web.sh.
# certbot adds the HTTPS (443) parts and http→https redirects once each domain points here.

server {
    listen 80;
    listen [::]:80;
    server_name __SITE_DOMAIN__;
    server_tokens off;

    location / {
        proxy_pass http://127.0.0.1:3001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }
    # photos and signed ID-document links are served by the API, under the main domain
    location ~ ^/(files|uploads)/ {
        proxy_pass http://127.0.0.1:4000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    # hashed build files never change: let browsers keep them for a year
    location /_next/static/ {
        proxy_pass http://127.0.0.1:3001;
        proxy_set_header Host $host;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }
}
