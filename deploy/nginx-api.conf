# Nginx site for the API. setup-server.sh fills in __API_DOMAIN__, installs it as
# /etc/nginx/sites-available/companio-api, and certbot then adds the HTTPS (443) block.
# Website origins allowed to read the "API is restarting" answer (keep in step with CORS_ORIGINS in apps/api/.env)
map $http_origin $companio_cors_origin {
    default "";
    ~^https://(www\.)?(getcompanio\.in|getcompanio\.app|campanio\.co\.in|campanio\.app)$ $http_origin;
}

server {
    listen 80;
    listen [::]:80;
    server_name __API_DOMAIN__;

    # ID photos, selfies and avatars are uploaded through the API
    client_max_body_size 12m;

    location / {
        proxy_pass http://127.0.0.1:4000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # live chat, location sharing and notifications use WebSockets (Socket.IO)
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }
    # While the API restarts (about 2s during a deploy) nginx can't reach it. Answer in a way the website can read and
    # retry — a bare 502 has no CORS headers, so the browser would only report "Failed to fetch".
    # Only nginx's own 502/503 land here: the request never reached the API, so repeating it is safe.
    error_page 502 503 = @api_down;
    location @api_down {
        default_type application/json;
        add_header Access-Control-Allow-Origin $companio_cors_origin always;
        add_header Access-Control-Allow-Credentials true always;
        add_header Access-Control-Allow-Methods "GET, POST, PUT, PATCH, DELETE, OPTIONS" always;
        add_header Access-Control-Allow-Headers "Authorization, Content-Type" always;
        add_header Retry-After 2 always;
        add_header Cache-Control no-store always;
        if ($request_method = OPTIONS) { return 204; }
        return 503 '{"statusCode":503,"message":"Companio is updating — please try again in a few seconds.","retry":true}';
    }
}
