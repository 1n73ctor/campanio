# Nginx site for the API. setup-server.sh fills in __API_DOMAIN__, installs it as
# /etc/nginx/sites-available/companio-api, and certbot then adds the HTTPS (443) block.
server {
    listen 80;
    listen [::]:80;
    server_name __API_DOMAIN__;

    # ID photos, selfies and avatars are uploaded through the API
    client_max_body_size 12m;

    location / {
        proxy_pass http://127.0.0.1:4000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # live chat, location sharing and notifications use WebSockets (Socket.IO)
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }
}
